name: Post queue

# Sends finished videos to Buffer a few days ahead. Does nothing until POSTING is "on".
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  post:
    if: vars.POSTING == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUFFER_API_KEY_1: ${{ secrets.BUFFER_API_KEY_1 }}
      BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/post-queue.ts
      - name: Commit what was scheduled
        if: always()
        run: |
          git config user.name reel-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/posts/ data/history.json
          git commit -qm "posted: queue" || echo "nothing to commit"
          git pull -q --rebase origin main && git push -q origin HEAD:main
